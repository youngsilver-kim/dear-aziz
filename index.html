<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Aziz ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #f7ede2;
      font-family: 'Poppins', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #fffef0;
      width: 100%;
      max-width: 480px;
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      border: 2px dashed #f6bd60;
      background-image: repeating-linear-gradient(#fffef0, #fffef0 31px, #e8e8e8 32px);
      line-height: 32px;
    }
    h1 {
      font-family: 'Caveat', cursive;
      font-size: 2.8rem;
      color: #f28482;
      margin: 0 0 20px 0;
      text-align: center;
    }
    #typewriter {
      font-size: 1.05rem;
      color: #444;
      white-space: pre-line;
      min-height: 140px;
    }
    .question-section {
      margin-top: 30px;
      text-align: center;
      display: none;
    }
    .question-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #f28482;
      margin-bottom: 20px;
    }
    .btn-group {
      display: flex;
      justify-content: center;
      gap: 20px;
      position: relative;
      min-height: 50px;
    }
    button {
      padding: 10px 24px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 25px;
      cursor: pointer;
    }
    #yesBtn {
      background-color: #84a59d;
      color: white;
    }
    #noBtn {
      background-color: #f28482;
      color: white;
      position: absolute;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.4);
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 16px;
      text-align: center;
      max-width: 300px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.15);
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Dear Aziz 💌</h1>
    <div id="typewriter"></div>

    <div class="question-section" id="questionSection">
      <div class="question-title">Do you want to go on a date with me? 🌹</div>
      <div class="btn-group">
        <button id="yesBtn" onclick="showModal()">YES! 💕</button>
        <button id="noBtn">NO 😜</button>
      </div>
    </div>
  </div>

  <div class="modal" id="successModal">
    <div class="modal-content">
      <h2 style="color: #f28482; margin-top:0;">Yay! 🥰</h2>
      <p style="color: #555;">I knew you would say YES<br>I love youuuuuuuuu❤️</p>
      <button onclick="closeModal()" style="background:#84a59d; color:white;">Close</button>
    </div>
  </div>

  <script>
    // 타자기 효과 텍스트 설정
    const text = `Hi my babyyyyyyyy!\n\nWhile everyone uses GitHub for writing code, I built this space just for you my baby.\n\nYou are my favorite commit(<- do you know what commit is?).\n\nI will always love u and be your sideeee ✨`;
    let index = 0;

    function typeWriter() {
      if (index < text.length) {
        document.getElementById("typewriter").innerHTML += text.charAt(index);
        index++;
        setTimeout(typeWriter, 45);
      } else {
        document.getElementById("questionSection").style.display = "block";
        initNoBtn();
      }
    }

    // NO 버튼 도망치는 로직
    function initNoBtn() {
      const noBtn = document.getElementById("noBtn");
      noBtn.style.left = "55%";

      const moveBtn = () => {
        const x = Math.random() * (window.innerWidth - 100);
        const y = Math.random() * (window.innerHeight - 50);
        noBtn.style.position = "fixed";
        noBtn.style.left = `${x}px`;
        noBtn.style.top = `${y}px`;
      };

      noBtn.addEventListener("mouseover", moveBtn);
      noBtn.addEventListener("touchstart", moveBtn);
    }

    function showModal() {
      document.getElementById("successModal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("successModal").style.display = "none";
    }

    window.onload = typeWriter;
  </script>
</body>
</html>
