<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Aziz ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #f7ede2;
      font-family: 'Poppins', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #fffef0;
      width: 100%;
      max-width: 480px;
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      border: 2px dashed #f6bd60;
      background-image: repeating-linear-gradient(#fffef0, #fffef0 31px, #e8e8e8 32px);
      line-height: 32px;
    }
    h1 {
      font-family: 'Caveat', cursive;
      font-size: 2.8rem;
      color: #f28482;
      margin: 0 0 15px 0;
      text-align: center;
    }
    
    /* 퀴즈 스타일 */
    .quiz-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #444;
      text-align: center;
      margin-bottom: 20px;
    }
    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .quiz-btn {
      width: 100%;
      padding: 12px 15px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #555;
      background-color: #fff;
      border: 2px solid #f6bd60;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
    }
    .quiz-btn:hover {
      background-color: #f6bd60;
      color: white;
    }

    /* 편지 영역 스타일 */
    #typewriter {
      font-size: 1.05rem;
      color: #444;
      white-space: pre-line;
      min-height: 140px;
    }
    .question-section {
      margin-top: 30px;
      text-align: center;
      display: none;
    }
    .question-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #f28482;
      margin-bottom: 20px;
    }
    .btn-group {
      display: flex;
      justify-content: center;
      gap: 20px;
      position: relative;
      min-height: 50px;
    }
    button.action-btn {
      padding: 10px 24px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 25px;
      cursor: pointer;
    }
    #yesBtn {
      background-color: #84a59d;
      color: white;
    }
    #noBtn {
      background-color: #f28482;
      color: white;
      position: absolute;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.4);
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 16px;
      text-align: center;
      max-width: 300px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.15);
    }
  </style>
</head>
<body>

  <!-- 1. Security Check 퀴즈 카드 -->
  <div class="card" id="quizCard">
    <h1>Security Check 🔒</h1>
    <div class="quiz-title" id="quizQuestion">Loading question...</div>
    <div class="quiz-options" id="quizOptions"></div>
  </div>

  <!-- 2. 편지 카드 (퀴즈 통과 시 출현) -->
  <div class="card" id="letterCard" style="display: none;">
    <h1>Dear Aziz 💌</h1>
    <div id="typewriter"></div>

    <div class="question-section" id="questionSection">
      <div class="question-title">Do you want to go on a date with me? 🌹</div>
      <div class="btn-group">
        <button id="yesBtn" class="action-btn" onclick="showModal()">YES! 💕</button>
        <button id="noBtn" class="action-btn">NO 😜</button>
      </div>
    </div>
  </div>

  <!-- 3. 모달 팝업 -->
  <div class="modal" id="successModal">
    <div class="modal-content">
      <h2 style="color: #f28482; margin-top:0;">WANNA GO DATE WITH ME??? YAYY!! 🥰</h2>
      <p style="color: #555;">I knew you would say yes<br>I love youuuuuuuuu❤️</p>
      <button class="action-btn" onclick="closeModal()" style="background:#84a59d; color:white;">Close</button>
    </div>
  </div>

  <script>
    // 퀴즈 데이터 설정
    const questions = [
      {
        question: "1. What is my pick up line?",
        options: ["hi you look cute", "do you wanna go date with me?", "rate me"],
        answer: 2
      },
      {
        question: "2. What is my favorite place to buy a smoothie?",
        options: ["delhaize", "carrefour", "aldi"],
        answer: 0
      },
      {
        question: "3. How do you call me?",
        options: ["my love", "darling", "kim youngeunaa"],
        answer: 2
      },
      {
        question: "4. What is my favorite place in belgium?",
        options: ["your place", "boulangerie", "carrefour"],
        answer: 2
      },
      {
        question: "5. Where did we meet?",
        options: ["Chung-ang uni", "JuSt road", "jeonju"],
        answer: 1
      }
    ];

    let currentQ = 0;

    function loadQuestion() {
      const q = questions[currentQ];
      document.getElementById("quizQuestion").innerText = q.question;
      const optionsContainer = document.getElementById("quizOptions");
      optionsContainer.innerHTML = "";

      q.options.forEach((opt, index) => {
        const btn = document.createElement("button");
        btn.className = "quiz-btn";
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(index);
        optionsContainer.appendChild(btn);
      });
    }

    function checkAnswer(selectedIndex) {
      if (selectedIndex === questions[currentQ].answer) {
        currentQ++;
        if (currentQ < questions.length) {
          loadQuestion();
        } else {
          alert("Yay! You are Aziz!");
          unlockLetter();
        }
      } else {
        alert("Who are you??????????? 🤨");
        currentQ = 0;
        loadQuestion();
      }
    }

    function unlockLetter() {
      document.getElementById("quizCard").style.display = "none";
      document.getElementById("letterCard").style.display = "block";
      typeWriter();
    }

    // 편지 내용 (마지막에 Nhabbik ❤️ 추가)
    const text = `Hi my babyyyyyyyy\n\nYou came back to this site!!! awww\n\nI can't focus on writing my thesis :((( and little bit bored\n\nI will always love u and be your sideeee ✨\n\nنحبك ❤️`;
    let index = 0;

    function typeWriter() {
      if (index < text.length) {
        document.getElementById("typewriter").innerHTML += text.charAt(index);
        index++;
        setTimeout(typeWriter, 45);
      } else {
        document.getElementById("questionSection").style.display = "block";
        initNoBtn();
      }
    }

    // NO 버튼 도망 로직
    function initNoBtn() {
      const noBtn = document.getElementById("noBtn");
      noBtn.style.left = "55%";

      const moveBtn = () => {
        const x = Math.random() * (window.innerWidth - 100);
        const y = Math.random() * (window.innerHeight - 50);
        noBtn.style.position = "fixed";
        noBtn.style.left = `${x}px`;
        noBtn.style.top = `${y}px`;
      };

      noBtn.addEventListener("mouseover", moveBtn);
      noBtn.addEventListener("touchstart", moveBtn);
    }

    function showModal() {
      document.getElementById("successModal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("successModal").style.display = "none";
    }

    window.onload = loadQuestion;
  </script>
</body>
</html>
